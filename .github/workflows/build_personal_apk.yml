name: Build Personal APK

on:
  # Allows you to manually trigger this build from the Actions tab button
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Pulls the source code from your personal fork into the virtual environment
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Sets up the Android SDK Environment
    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: 'true'

    # Configures the Java Development Kit required for Android Gradle builds
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # Grants execution permissions to the wrapper tool script in the project root
    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    # Compiles the source files into a debug or unsigned package release
    - name: Compile Application Package with Gradle
      run: ./gradlew assembleDebug

    # Extracts the finished package file out of the container so you can download it
    - name: Upload Compiled APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: personal-inure-build
        path: app/build/outputs/apk/debug/*.apk
